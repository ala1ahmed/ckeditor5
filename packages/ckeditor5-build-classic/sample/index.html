<!DOCTYPE html>
<!--
	Manual check page for the built bundle. Build first (npm run build), then
	open this file in a browser. The PDF button needs a running backend that
	accepts the request (see README → htmlToPdf); without one it logs an error.
-->
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<title>ckeditor5-build-classic — sample</title>
		<style>
			:root { --app-surface: #ffffff; --app-brand: #4b2da8; }
			body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 16px; }
			h2 { font-size: 1rem; margin: 2rem 0 .5rem; }
		</style>
	</head>
	<body>
		<h2>Stock look (no theme)</h2>
		<div id="stock"><p>Éditeur sans thème.</p></div>

		<h2>Dark preset, brand colour from a CSS token, PDF export</h2>
		<div id="dark"><h2>Document</h2><p>Sélectionnez du texte et ajoutez un lien pour voir la bulle thémée.</p></div>

		<h2>Light preset with overrides</h2>
		<div id="light"><p>Client : <span class="h-card p-label" data-key="k1" data-entity="client">Acme</span></p></div>

		<script src="../build/ckeditor.js"></script>
		<script>
			const { ClassicEditor } = window.CKEDITOR;

			ClassicEditor.create( document.querySelector( '#stock' ) );

			ClassicEditor.create( document.querySelector( '#dark' ), {
				toolbar: [ 'undo', 'redo', '|', 'heading', '|', 'bold', 'italic', 'link', '|', 'insertTable', '|', 'htmlToPdf' ],
				theme: { preset: 'dark', colors: { primary: 'var(--app-brand)' }, radius: '8px' },
				htmlToPdf: {
					url: 'http://localhost:5000/doc/html-to-pdf',
					data: () => ( { title: 'Exemple' } ),
					fileName: () => 'exemple.pdf'
				}
			} );

			ClassicEditor.create( document.querySelector( '#light' ), {
				theme: {
					colors: { primary: '#4b2da8', primaryHover: '#6b47d6', primarySoft: '#f0edfb', border: '#e5dff9' },
					radius: '10px',
					fontFamily: 'Georgia, serif'
				}
			} );
		</script>
	</body>
</html>
